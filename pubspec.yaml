name: plant_finder
description: A Flutter plant identification app with local accounts and photo history.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  get: ^4.6.6
  sqflite: ^2.4.0
  path_provider: ^2.1.4
  path: ^1.9.0
  image_picker: ^1.1.2
  image: ^4.2.0
  shared_preferences: ^2.5.6
  http: ^1.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1
  sqflite_common_ffi: ^2.3.4

flutter_launcher_icons:
  android: launcher_icon
  ios: true
  remove_alpha_ios: true
  image_path: img/icon.png
  min_sdk_android: 21
  adaptive_icon_background: '#ffffff'
  adaptive_icon_foreground: img/icon.png

flutter:
  uses-material-design: true
  assets:
    - img/splash.jpg
    - img/flower.png
    - img/history_plant.png
    - img/history_plant2.png
    - img/upload.png
    - img/icon.png
    - img/back.png
